<svg xmlns="http://www.w3.org/2000/svg" width="340" height="195" viewBox="0 0 340 195" fill="none" role="img">
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; }
    .title { font-size: 18px; font-weight: 600; fill: #A78BFA; }
    .label { font-size: 14px; fill: #C0CAF5; }
    .value { font-size: 14px; font-weight: 600; fill: #A78BFA; }
    .icon  { font-size: 14px; }
    .pct   { font-size: 12px; fill: #565F89; }
    /* 默认可见；支持 CSS 动画的环境才做淡入（backwards 让 delay 期间应用 from 状态） */
    .fade  { animation: fadein 0.5s ease-in-out backwards; }
    @keyframes fadein { from { opacity: 0; } }
  </style>
  <text x="25" y="33" class="title fade">常用语言</text>
  <rect x="25" y="50" width="290" height="10" rx="5" fill="#565F89" opacity="0.25"/>
  <clipPath id="bar"><rect x="25" y="50" width="290" height="10" rx="5"/></clipPath>
  <g clip-path="url(#bar)" class="fade" style="animation-delay:150ms">
    <rect x="25.0" y="50" width="179.4" height="10" fill="#3572A5"/>
    <rect x="204.4" y="50" width="55.7" height="10" fill="#3178c6"/>
    <rect x="260.1" y="50" width="46.4" height="10" fill="#f1e05a"/>
    <rect x="306.5" y="50" width="6.6" height="10" fill="#663399"/>
    <rect x="313.1" y="50" width="1.1" height="10" fill="#012456"/>
    <rect x="314.2" y="50" width="0.8" height="10" fill="#f34b7d"/>
  </g>
  <g class="fade" style="animation-delay:300ms">
    <circle cx="30" cy="80" r="5" fill="#3572A5"/>
    <text x="43" y="84" class="label">Python</text>
    <text x="125" y="84" class="pct">61.9%</text>
  </g>
  <g class="fade" style="animation-delay:380ms">
    <circle cx="180" cy="80" r="5" fill="#3178c6"/>
    <text x="193" y="84" class="label">TypeScript</text>
    <text x="275" y="84" class="pct">19.2%</text>
  </g>
  <g class="fade" style="animation-delay:460ms">
    <circle cx="30" cy="104" r="5" fill="#f1e05a"/>
    <text x="43" y="108" class="label">JavaScript</text>
    <text x="125" y="108" class="pct">16.0%</text>
  </g>
  <g class="fade" style="animation-delay:540ms">
    <circle cx="180" cy="104" r="5" fill="#663399"/>
    <text x="193" y="108" class="label">CSS</text>
    <text x="275" y="108" class="pct">2.3%</text>
  </g>
  <g class="fade" style="animation-delay:620ms">
    <circle cx="30" cy="128" r="5" fill="#012456"/>
    <text x="43" y="132" class="label">PowerShell</text>
    <text x="125" y="132" class="pct">0.4%</text>
  </g>
  <g class="fade" style="animation-delay:700ms">
    <circle cx="180" cy="128" r="5" fill="#f34b7d"/>
    <text x="193" y="132" class="label">C++</text>
    <text x="275" y="132" class="pct">0.3%</text>
  </g>
</svg>