<svg xmlns="http://www.w3.org/2000/svg" width="340" height="195" viewBox="0 0 340 195" fill="none" role="img">
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; }
    .title { font-size: 18px; font-weight: 600; fill: #8250DF; }
    .label { font-size: 14px; fill: #1F2328; }
    .value { font-size: 14px; font-weight: 600; fill: #8250DF; }
    .icon  { fill: #0969DA; }
    .pct   { font-size: 12px; fill: #656D76; }
    /* 默认可见；支持 CSS 动画的环境才做淡入（backwards 让 delay 期间应用 from 状态） */
    .fade  { animation: fadein 0.5s ease-in-out backwards; }
    @keyframes fadein { from { opacity: 0; } }
  </style>
  <text x="25" y="33" class="title fade">常用语言</text>
  <rect x="25" y="50" width="290" height="10" rx="5" fill="#656D76" opacity="0.25"/>
  <clipPath id="bar"><rect x="25" y="50" width="290" height="10" rx="5"/></clipPath>
  <g clip-path="url(#bar)" class="fade" style="animation-delay:150ms">
    <rect x="25.0" y="50" width="136.2" height="10" fill="#3178c6"/>
    <rect x="161.2" y="50" width="87.7" height="10" fill="#3572A5"/>
    <rect x="249.0" y="50" width="56.3" height="10" fill="#f1e05a"/>
    <rect x="305.3" y="50" width="7.2" height="10" fill="#663399"/>
    <rect x="312.5" y="50" width="1.7" height="10" fill="#89e051"/>
    <rect x="314.2" y="50" width="0.8" height="10" fill="#012456"/>
  </g>
  <g class="fade" style="animation-delay:300ms">
    <circle cx="30" cy="80" r="5" fill="#3178c6"/>
    <text x="43" y="84" class="label">TypeScript</text>
    <text x="125" y="84" class="pct">47.0%</text>
  </g>
  <g class="fade" style="animation-delay:380ms">
    <circle cx="180" cy="80" r="5" fill="#3572A5"/>
    <text x="193" y="84" class="label">Python</text>
    <text x="275" y="84" class="pct">30.3%</text>
  </g>
  <g class="fade" style="animation-delay:460ms">
    <circle cx="30" cy="104" r="5" fill="#f1e05a" stroke="#656D76"/>
    <text x="43" y="108" class="label">JavaScript</text>
    <text x="125" y="108" class="pct">19.4%</text>
  </g>
  <g class="fade" style="animation-delay:540ms">
    <circle cx="180" cy="104" r="5" fill="#663399"/>
    <text x="193" y="108" class="label">CSS</text>
    <text x="275" y="108" class="pct">2.5%</text>
  </g>
  <g class="fade" style="animation-delay:620ms">
    <circle cx="30" cy="128" r="5" fill="#89e051" stroke="#656D76"/>
    <text x="43" y="132" class="label">Shell</text>
    <text x="125" y="132" class="pct">0.6%</text>
  </g>
  <g class="fade" style="animation-delay:700ms">
    <circle cx="180" cy="128" r="5" fill="#012456"/>
    <text x="193" y="132" class="label">PowerShell</text>
    <text x="275" y="132" class="pct">0.3%</text>
  </g>
</svg>